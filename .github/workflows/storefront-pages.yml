name: Publish reviewed storefront artifact

on:
  workflow_run:
    workflows: [Frontend CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_rollback:
        description: Deploy the pinned pre-PR-29 sanitized storefront baseline
        required: true
        type: boolean

permissions: {}

concurrency:
  group: github-pages-storefront
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify and package storefront
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && inputs.confirm_rollback == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IGLOUE_STOREFRONT_BUILD_TARGET: staging
      IGLOUE_STOREFRONT_STAGING_SUPABASE_URL: ${{ vars.IGLOUE_STOREFRONT_STAGING_SUPABASE_URL }}
      IGLOUE_STOREFRONT_STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ vars.IGLOUE_STOREFRONT_STAGING_SUPABASE_PUBLISHABLE_KEY }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the exact CI-tested main revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Download artifact from the successful main CI run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: storefront-pages
          path: ${{ runner.temp }}/storefront-site
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Build the pinned sanitized rollback artifact
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          rollback_sha="$(node -p 'require("./release/storefront-rollback-manifest.json").source_public_main')"
          node scripts/build-storefront-release.mjs build \
            --manifest release/storefront-rollback-manifest.json \
            --source-ref "$rollback_sha" \
            --out "$RUNNER_TEMP/storefront-site"

      - name: Verify artifact against reviewed allowlist and hashes
        if: github.event_name == 'workflow_run'
        run: node scripts/build-storefront-release.mjs verify --dir "$RUNNER_TEMP/storefront-site"

      - name: Verify rollback artifact against its historical allowlist
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/build-storefront-release.mjs verify --manifest release/storefront-rollback-manifest.json --dir "$RUNNER_TEMP/storefront-site"

      - name: Ensure this is still the current main revision
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          latest_sha="$(git ls-remote https://github.com/igloue16/igloue.git refs/heads/main | cut -f1)"
          if [[ "$latest_sha" != "$TESTED_SHA" ]]; then
            echo "Refusing to publish stale CI revision $TESTED_SHA; current main is $latest_sha." >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload only the verified storefront to Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ runner.temp }}/storefront-site

  deploy:
    name: Owner-approved Pages deployment
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    # Configure this environment with the owner as a required reviewer,
    # allow owner self-review, disallow admin bypass, and allow main only.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recheck that reviewed main artifact is still current
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          latest_sha="$(git ls-remote https://github.com/igloue16/igloue.git refs/heads/main | cut -f1)"
          if [[ "$latest_sha" != "$TESTED_SHA" ]]; then
            echo "Refusing to publish stale CI revision $TESTED_SHA; current main is $latest_sha." >&2
            exit 1
          fi

      - name: Deploy reviewed artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
