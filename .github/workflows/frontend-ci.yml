name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Run frontend tests
        run: node --test tests/*.test.js

      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          checked=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            checked=$((checked + 1))
          done < <(find assets/js admin -type f -name '*.js' -print0)
          if [[ "$checked" -eq 0 ]]; then
            echo "No browser JavaScript files were found." >&2
            exit 1
          fi
          echo "Syntax-checked $checked browser JavaScript files."
