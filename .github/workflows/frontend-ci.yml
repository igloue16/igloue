name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IGLOUE_STOREFRONT_BUILD_TARGET: staging
      IGLOUE_STOREFRONT_STAGING_SUPABASE_URL: ${{ vars.IGLOUE_STOREFRONT_STAGING_SUPABASE_URL }}
      IGLOUE_STOREFRONT_STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ vars.IGLOUE_STOREFRONT_STAGING_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Build and verify the allowlisted release artifact
        run: |
          node scripts/build-storefront-release.mjs build --out "$RUNNER_TEMP/storefront-release-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Run customer tests in a pruned storefront-only tree
        run: |
          node scripts/run-storefront-tests.mjs --site "$RUNNER_TEMP/storefront-release-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Check published browser JavaScript syntax
        run: |
          node scripts/check-storefront-syntax.mjs --dir "$RUNNER_TEMP/storefront-release-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Save reviewed Pages artifact for main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: storefront-pages
          path: ${{ runner.temp }}/storefront-release-ci-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1
