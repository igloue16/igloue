<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <style>
    #roof-interior { opacity: var(--roof-glow-opacity, 0); transition: opacity 250ms ease; }
    .heat-wave { stroke: var(--heat-wave-stroke, #0d4f71); transition: stroke 260ms ease; }
    @media (prefers-reduced-motion: reduce) { #roof-interior, .heat-wave { transition: none; } }
  </style>
  <defs><filter id="roof-glow-blur" x="-40%" y="-55%" width="180%" height="200%"><feGaussianBlur stdDeviation="7"/></filter></defs>
  <g id="condition-roof">
    <path id="roof-interior" class="roof-interior interior-glow" d="M45 91L80 50L115 91Z" fill="#e6a24a" filter="url(#roof-glow-blur)"/>
    <path id="roof" class="roof" d="M23 104L80 40L137 104" fill="none" stroke="#0d4f71" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="roof-heat-lines" class="heat-waves heat-waves--roof" fill="none" stroke="#0d4f71" stroke-width="7" stroke-linecap="round">
      <g transform="translate(61 72)"><path id="roof-heat-line-1" class="heat-wave heat-wave--1" d="M0 56C-8 47 8 39 0 30C-8 21 8 12 0 3"/></g>
      <g transform="translate(80 72)"><path id="roof-heat-line-2" class="heat-wave heat-wave--2" d="M0 56C-8 47 8 39 0 30C-8 21 8 12 0 3"/></g>
      <g transform="translate(99 72)"><path id="roof-heat-line-3" class="heat-wave heat-wave--3" d="M0 56C-8 47 8 39 0 30C-8 21 8 12 0 3"/></g>
    </g>
  </g>
</svg>
