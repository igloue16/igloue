<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 140">
  <style>
    #sliding-opening-reveal { opacity: var(--opening-reveal-opacity, 0); transition: opacity 260ms ease; }
    #sliding-opening-sash { transform: translateX(var(--sliding-sash-x, 0px)); transition: transform 340ms cubic-bezier(.2,.75,.25,1); }
    #sliding-opening-sash .opening-frame, #sliding-opening-sash .handle { stroke: var(--opening-movable-stroke, #0d4f71); transition: stroke 260ms ease; }
    .glass { fill: var(--opening-glass-fill, #f7fbfd); transition: fill 260ms ease; }
    @media (prefers-reduced-motion: reduce) { #sliding-opening-reveal, #sliding-opening-sash, #sliding-opening-sash .opening-frame, #sliding-opening-sash .handle, .glass { transition: none; } }
  </style>
  <defs><clipPath id="sliding-frame-clip"><rect x="17" y="21" width="146" height="100"/></clipPath></defs>
  <g id="opening-sliding" fill="none" stroke="#0d4f71" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <rect id="sliding-outer-frame" class="outer-frame fixed-frame" x="15" y="20" width="150" height="103" fill="#ffffff"/>
    <g clip-path="url(#sliding-frame-clip)"><rect id="sliding-opening-reveal" class="opening-reveal" x="27" y="32" width="58" height="79" fill="#fff6e9" stroke="none"/><g id="sliding-fixed-pane" class="fixed-pane"><rect class="glass" x="94" y="32" width="59" height="79"/><rect class="fixed-frame" x="94" y="32" width="59" height="79"/><path class="reflection" d="M111 75L126 59M111 91L129 72" stroke-width="4"/></g><g id="sliding-opening-sash" class="opening-sash"><rect class="glass" x="27" y="32" width="59" height="79"/><rect class="opening-frame" x="27" y="32" width="59" height="79"/><path class="reflection" d="M44 75L59 59M44 91L62 72" stroke-width="4"/><path class="handle" d="M87 63V82" stroke-width="7"/></g></g>
  </g>
</svg>
