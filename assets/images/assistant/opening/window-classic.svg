<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 140">
  <style>
    #classic-opening-sash { transform: scaleX(var(--classic-sash-scale, 1)); transform-box: fill-box; transform-origin: right center; transition: transform 330ms cubic-bezier(.2,.75,.25,1); }
    #classic-opening-sash .opening-frame, #classic-opening-sash .handle { stroke: var(--opening-movable-stroke, #0d4f71); transition: stroke 260ms ease; }
    .glass { fill: var(--opening-glass-fill, #f7fbfd); transition: fill 260ms ease; }
    @media (prefers-reduced-motion: reduce) { #classic-opening-sash, #classic-opening-sash .opening-frame, #classic-opening-sash .handle, .glass { transition: none; } }
  </style>
  <g id="opening-casement" fill="none" stroke="#0d4f71" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <rect id="classic-outer-frame" class="outer-frame fixed-frame" x="15" y="20" width="150" height="103" fill="#ffffff"/>
    <g id="classic-fixed-pane" class="fixed-pane"><rect class="glass" x="27" y="32" width="57" height="79"/><rect class="fixed-frame" x="27" y="32" width="57" height="79"/><path class="reflection" d="M43 75L58 59M43 91L61 72" stroke-width="4"/></g>
    <g id="classic-opening-sash" class="opening-sash"><rect class="glass" x="97" y="32" width="56" height="79"/><rect class="opening-frame" x="97" y="32" width="56" height="79"/><path class="reflection" d="M113 75L128 59M113 91L131 72" stroke-width="4"/><path class="handle" d="M91 64V81" stroke-width="7"/></g>
  </g>
</svg>
